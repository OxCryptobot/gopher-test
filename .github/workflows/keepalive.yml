name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Keeps free hosts awake and fails (notifying repo watchers) when the app is down.
jobs:
  ping:
    if: ${{ vars.GOPHER_PUBLIC_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 30 "${{ vars.GOPHER_PUBLIC_URL }}/health" && exit 0
            sleep 20
          done
          echo "::error::GOPHER is down"
          exit 1
